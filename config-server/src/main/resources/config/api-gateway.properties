server.port=8060
eureka.client.serviceUrl.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}

security.jwt.secret=${JWT_SECRET:0123456789012345678901234567890101234567890123456789012345678901}

#routers 0
spring.cloud.gateway.server.webmvc.routes[0].id=usuariotec
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://usuariotec
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/usuarios/**,/api/roles/**

#routers 1
spring.cloud.gateway.server.webmvc.routes[1].id=productec
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://productec
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/productos/**,/api/producto-tipos/**,/api/categorias/**,/api/comentarios/**

#routers 2
spring.cloud.gateway.server.webmvc.routes[2].id=ventastec
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://ventastec
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/ventas/**,/api/carritos/**,/api/carrito-detalles/**

#routers 3
spring.cloud.gateway.server.webmvc.routes[3].id=auth-service
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://auth-service
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/auth/**




