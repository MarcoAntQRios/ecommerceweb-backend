server.port=8081

security.jwt.secret=${JWT_SECRET:0123456789012345678901234567890101234567890123456789012345678901}

# configuracion postgresql
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ecommerce_db?currentSchema=usuariotec}
