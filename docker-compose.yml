      productec:
        condition: service_started
      usuariotec:
        condition: service_started
      ventastec:
        condition: service_started
    networks:
      - private-net
      - public-net

networks:
  private-net:
    driver: bridge
  public-net:
    driver: bridge

volumes:
  postgres-ecommerce-data:
