      JWT_SECRET: "553cb2d4b3e3e482ac4d4506560f9e045402f68b6e6cba0742550d67b4ca19c6"
      DB_URL: jdbc:postgresql://ep-calm-pond-at9349ee.c-9.us-east-1.aws.neon.tech/ecommerce_db?currentSchema=productec&sslmode=require
      DB_USERNAME: neondb_owner
      DB_PASSWORD: npg_VoxWvRLSY25r
    expose:
      - "8082"
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - private-net

  usuariotec:
    build:
      context: ./usuariotec
    image: springcloud/usuariotec:local
    container_name: usuariotec
    environment:
      CONFIG_SERVER_URL: http://config-server:8090
      EUREKA_URL: http://eureka-server:8761/eureka/
      JWT_SECRET: "553cb2d4b3e3e482ac4d4506560f9e045402f68b6e6cba0742550d67b4ca19c6"
      JWT_EXPIRATION: 900000
      DB_URL: jdbc:postgresql://ep-calm-pond-at9349ee.c-9.us-east-1.aws.neon.tech/ecommerce_db?currentSchema=usuariotec&sslmode=require
      DB_USERNAME: neondb_owner
      DB_PASSWORD: npg_VoxWvRLSY25r
    expose:
      - "8081"
    depends_on:
